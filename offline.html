<html lang="en">
<head>

<title>You are offline | NUFA</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}

  p{color:#d9d4c7;line-height:1.6;margin:0 0 22px}

</style>
</head>
<body>
  <div class="box">
    <img src="assets/images/pwa/icon-192.png" alt="NUFA">
